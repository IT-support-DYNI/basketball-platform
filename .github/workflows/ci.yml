name: CI

on:
  push:
    branches: [master, dyni-blazers]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci
        env:
          # `postinstall` runs `prisma generate`, which only needs the schema.
          PRISMA_SKIP_POSTINSTALL_GENERATE: "false"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests + accessibility (axe)
        run: npm run test:run

      - name: Build
        run: npx next build
        env:
          # Build must not touch a real database. These are throwaway values
          # just to satisfy schema validation and NextAuth at build time —
          # no migration or query runs during `next build`.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"
          NEXTAUTH_SECRET: "ci-build-only-not-a-real-secret"
          NEXTAUTH_URL: "http://localhost:3000"

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dyni
          POSTGRES_PASSWORD: dyni
          POSTGRES_DB: dyni_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://dyni:dyni@localhost:5432/dyni_e2e"
      DIRECT_URL: "postgresql://dyni:dyni@localhost:5432/dyni_e2e"
      NEXTAUTH_SECRET: "e2e-only-not-a-real-secret"
      NEXTAUTH_URL: "http://localhost:3000"
      MAIL_TRANSPORT: "console"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Apply migrations + seed
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: Build
        run: npx next build

      - name: E2E
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
